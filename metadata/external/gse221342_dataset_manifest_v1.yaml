why_this_dataset: >-
  Same-line-to-anchor boundary-stress tranche. BU3 NGAT is the same iPSC
  line as the BU3 anchor query — this is the first external tranche from
  the same line as an anchor, enabling direct same-line anchor comparison.
  Adds a genuinely new culture-format axis (ALI / transwell) not present
  in any current comparison-world tranche. Tests whether iAT1
  differentiation on BU3 NGAT produces the same SOX2lowCFTR+ shift seen
  in SPC2-ST-B2 (GSE221343 L+DCI). Selected as the immediate tranche
  lane from the BU/Kotton Burgess 2024 family after accession
  disambiguation (see reports/repo_state/
  bu_kotton_3d_vs_ali_accession_resolution_v1.md). CAVEAT: this is NOT a
  same-line SPC2-ST-B2 validation tranche for P-0001. BU3 NGAT is a
  different iPSC line from the P-0001 basis (SPC2-ST-B2). P-0001
  relevance, if any, would be cross-line supportive evidence, not
  same-line validation.

added_value_vs_existing_world: >-
  Adds two axes absent from the current comparison world: (1) ALI culture
  format — the only transwell/air-liquid-interface condition among all
  accepted tranches; (2) BU3 NGAT cell line — same line as the BU3 anchor
  query, enabling direct anchor-external comparison. Also provides a
  second iPSC line with iAT1 3D differentiation (BU3 NGAT L+DCI vs
  SPC2-ST-B2 L+DCI in GSE221343), testing whether the SOX2lowCFTR+ shift
  replicates cross-line within the same lab. The 4-sample design (iAT2 3D
  + iAT1 3D + iAT1 ALI p0 + iAT1 ALI p1) enables within-tranche
  comparison of culture format and passage effects on iAT1 identity.

low_friction_notes: >-
  4 per-GSM CellRanger v3 filtered H5 files in GSE221342_RAW.tar (54.5 Mb
  total). Standard 10x Chromium format. Gene-space audit confirmed 58398
  Gene Expression features per sample, 28378/30852 (91.98%) reference gene
  overlap — identical to GSE221343/GSE221344. 162 duplicate gene symbols
  (1543 extra entries) resolved via var_names_make_unique. 3 custom/reporter
  features retained (EGFP_EXTRA, TDTOMATO_EXTRA_IVS, BFP-WPRE). Genome
  tag is GRCh38_tdtomato_gfp_bfp_wpre. No gene-symbol remapping needed.

public_artifact_situation: >-
  Per-GSM CellRanger filtered H5 files available individually and bundled
  in GSE221342_RAW.tar (54.5 Mb). 4 samples = 4 H5 files:
  GSM6858850_iAT2_3D.h5 (12.4 Mb), GSM6858851_iAT1_3D.h5 (15.4 Mb),
  GSM6858852_iAT1_ALI_p0.h5 (12.0 Mb), GSM6858853_iAT1_ALI_p1.h5
