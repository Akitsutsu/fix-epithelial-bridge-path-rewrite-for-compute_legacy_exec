conversion_notes: >-
  H5-to-H5AD conversion completed 2026-04-09. All 4 samples: CellRanger
  v3 filtered H5, float32 raw counts (integer-valued), 58398 Gene
  Expression features, 28378/30852 (91.98%) reference gene overlap —
  identical to GSE221343/GSE221344. Genome build confirmed as
  GRCh38_tdtomato_gfp_bfp_wpre (custom CellRanger reference with EGFP,
  tdTomato-IVS, and BFP-WPRE appended for BU3 NGAT dual-reporter line).
  162 duplicate gene symbols (1543 extra entries) resolved via
  var_names_make_unique. 3 custom/reporter features retained:
  EGFP_EXTRA (NKX2-1-GFP knock-in), TDTOMATO_EXTRA_IVS (SFTPC-tdTomato),
  BFP-WPRE (lentiviral construct element). No gene-symbol remapping
  needed. Conversion script:
  queries/converted/gse221342/convert_gse221342_h5_to_h5ad.py.
  qc_status set to local_validation_inspected_manual_review_required.
  query_ready_flag remains false pending projection and review.

review_notes: >-
  All 4 rows promoted to query_ready_flag=true after explicit reviewer
  decision 2026-04-09. Gate A (object contract), Gate B (provenance),
  Gate C (projection smoke test on v1), and Gate D (within-tranche
  biology coherence) all passed. Promoted as a boundary-stress tranche:
  iAT2 3D maps to mid_GW14_16 (first external row at this stage); iAT1
  3D/ALI p0/ALI p1 show SOX2lowCFTR+ dominant (60.9-78.0%), replicating
  the L+DCI shift cross-line (BU3 NGAT vs SPC2-ST-B2 in GSE221343).
  ALI p1 has strongest SOX2lowCFTR+ (78.0%) and best alignment (0.773)
  of any tranche. This is NOT a P-0001 validation tranche (BU3 NGAT,
  not SPC2-ST-B2). Review artifacts at
  reports/tranches/gse221342_query_ready_review_v1/.
