notes: >-
  Same-line kinetic strengthening tranche for P-0002 alveolar commitment
  direction. BU3 NGAT is the same iPSC line as GSE221342 (already canonical
  in v4) and the BU3 anchor query. Adds temporal resolution (24/48/72hr
  kinetic) to the L+DCI commitment shift already observed as an endpoint
  in GSE221342. Per-sample CellRanger filtered H5 files are directly
  available — same format as GSE221342. Expected to use the same
  H5-to-H5AD conversion path. This is NOT a P-0001 same-line SPC2-ST-B2
  tranche (BU3 NGAT != SPC2-ST-B2). Candidate only; not yet reviewed or
  promoted.
