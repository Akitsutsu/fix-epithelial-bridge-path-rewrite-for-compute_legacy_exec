design_summary: >-
  BU3 NGAT iPSCs differentiated into iAT2s in 3D Matrigel. Cells passaged
  into iAT2 medium (CK+DCI); first sample taken 3 days post-passage as
  baseline. Remaining cells switched to iAT1 differentiation medium (L+DCI);
  samples taken at 24, 48, and 72 hours post media change. 4 samples total.
  Same cell line and lab as GSE221342 (BU3 NGAT, Kotton/BU).

