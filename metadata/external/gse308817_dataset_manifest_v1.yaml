why_this_dataset: >-
  Fourth external intake candidate. Independent lab (Liu/Rong, Xiamen
  University) with hESC-derived (H9) alveolar organoids at 3 passage
  timepoints (P3/P7/P20). Adds passage/maturation axis not present in
  existing tranches. Long-term expandability (>30 passages) distinguishes
  this system from existing Matrigel-based or micro-patterned organoids.

added_value_vs_existing_world: >-
  Third independent lab in comparison world (Xiamen vs BU vs Kyoto);
  hESC H9 line adds a new stem cell background (vs iPSC SPC2-ST-B2 and
  B2-3); passage series (P3/P7/P20) adds a maturation/stability axis
  not covered by existing condition-based tranches.

low_friction_notes: >-
  3 per-GSM mtx triplets in GSE308817_RAW.tar. Standard sparse matrix
  format (barcodes/features/matrix). hg38 assembly. Clear per-sample
  naming (ALOp3, ALOp7, ALOp20).

platform_notes: >-
  Library preparation used SeekOne Single Cell Whole Transcriptome Kit
  (SeekGene K00801), NOT 10x Chromium. Data processed with SeekSoulTools
  v1.2.2 (not CellRanger). Output format is standard 10x-like sparse
  matrix triplets (barcodes.tsv.gz, features.tsv.gz, matrix.mtx.gz).
  Compatibility with 10x-based reference pipeline should be verified
  during local validation — gene naming and feature space may differ.

public_artifact_situation: >-
  Per-sample mtx triplets available both as individual GSM supplementary
  files and bundled in GSE308817_RAW.tar. 3 samples = 3 triplets = 9
  files. Each sample corresponds to one passage (P3, P7, P20).

registration_notes: >-
