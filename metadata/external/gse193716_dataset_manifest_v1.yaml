why_this_dataset: >-
  Fifth external intake candidate. Same lab (Kotton / BU) and iPSC line
  (SPC2-ST-B2) as GSE221343 but uniquely includes freshly isolated primary
  adult AEC2s alongside isogenic cultured primary and iPSC-derived AEC2s.
  This enables direct primary-vs-iPSC benchmarking within a single dataset.
  The primary AEC2 component would be the first non-iPSC/non-hESC/non-fetal
  adult tissue in the comparison world — testing whether the fetal lung
  reference can resolve adult primary vs organoid-derived epithelial identity.
  Two primary donors (PL1, PL2) each provide pre-culture and cultured pairs.
  Three iAEC2 culture conditions (3D, 3D/insert, +MRC5/insert) test culture
  format effects. Published in JCI Insight (PMID 36454643, 75+ PMC citations).

added_value_vs_existing_world: >-
  First primary adult tissue in the comparison world (all existing tranches
  are iPSC-derived, hESC-derived, or fetal lung-derived organoids). Same
  lab and iPSC line as GSE221343 enables controlled comparison: GSE193716
  iAEC2 3D vs GSE221343 CK+DCI are the same cell type in similar culture
  but profiled independently. Pre-culture vs cultured isogenic pairs add a
  culture effect axis. Co-culture with MRC5 fibroblasts adds a stromal
  interaction axis. Adult primary AEC2s would test fetal reference limits.

low_friction_notes: >-
  7 per-GSM CellRanger filtered H5 files in GSE193716_RAW.tar. Standard
  10x Chromium format. Same library prep and analysis pipeline as GSE221343
  (CellRanger v3). Genome build confirmed as GRCh38_tdtomato_10X (GEO text
  said hg19 but actual H5 genome tag is GRCh38). 33539 Gene Expression
  features per sample, 26975/30852 (87.4%) reference overlap. Gap is
  lncRNA annotation drift; no gene-symbol remapping needed.

platform_notes: >-
  10x Chromium 3' scRNA-seq, CellRanger v3 pipeline. Genome build is
  GRCh38_tdtomato_10X (custom GRCh38 with TdTomato reporter appended).
  NOTE: GEO data processing section states hg19, but direct H5 inspection
  confirms GRCh38. Gene-space compatibility verified during audit:
  26975/30852 (87.4%) overlap with current reference. Missing genes are
  lncRNA annotation differences (AC/AL/AP prefix, LINC), not protein-
  coding. All key lung markers present. 32 duplicate gene symbols resolved
  via var_names_make_unique during conversion.

public_artifact_situation: >-
  Per-GSM CellRanger filtered H5 files available individually and bundled
  in GSE193716_RAW.tar. 7 samples = 7 H5 files. Series-level combined
  Seurat RDS (GSE193716_sc.Rds.gz) also available but is an R object, not
  H5AD. Per-sample H5 files are the preferred intake path.

registration_notes: >-
  [Superseded by conversion_notes below.]
  Dataset-level registration only. This is the fifth external intake
  candidate. Selected for primary-vs-iPSC benchmark value, isogenic
  culture pairs, and same-lab controlled comparison with GSE221343.
  CAVEAT: primary AEC2 samples are adult tissue — projection onto the
  fetal lung reference has unknown interpretability and must be explicitly
  evaluated during review. NOTE: intended analysis role is primary-
  benchmark-candidate but this value is not yet in the data_contract.yaml
  enum; role will be formalized if/when the tranche passes local validation.
  NOTE: the cultured primary samples (GSM5819129, GSM5819130) and one iAEC2
  sample (GSM5819135) were co-cultured with MRC5 fibroblasts but FACS
  EPCAM+ sorted post-culture to exclude fibroblasts.

conversion_notes: >-
  H5-to-H5AD conversion completed 2026-04-07. All 7 samples: CellRanger v3
  filtered H5, float32 raw counts (integer-valued), 33539 Gene Expression
  features, 26975/30852 (87.4%) reference gene overlap. Genome build
  confirmed as GRCh38_tdtomato_10X (GEO text said hg19 but actual H5
  genome tag is GRCh38). Gap is lncRNA annotation drift (AC/AL/AP/LINC
  prefix); no gene-symbol remapping needed. 32 duplicate gene symbols
  resolved via var_names_make_unique. TdTomato reporter retained. Conversion
  script: queries/converted/gse193716/convert_gse193716_h5_to_h5ad.py.
  qc_status set to local_validation_inspected_manual_review_required.
  query_ready_flag remains false for primary rows pending biological
  review. Adult-primary-vs-fetal-reference caveat remains unresolved.

review_notes: >-
  iAEC2 subset (3 rows) promoted to query_ready_flag=true after explicit
  reviewer decision 2026-04-07. Gate A (object contract), Gate B
  (provenance), Gate C (projection smoke test on v1), and Gate D
  (within-tranche biology coherence) all passed for the iAEC2 subset.
  Proliferating progenitors as top epi state_fine replicates GSE289846
  3i_Day7 cross-dataset. Culture-format comparison (3D vs insert vs
  +MRC5) is internally coherent. 4 primary AEC2 rows remain
  query_ready_flag=false: 2 pre-culture (hold_pending_biological_review)
  and 2 cultured (not_recommended_now due to elevated off-target).
  Dataset-level query_ready_flag remains false because the primary rows
  are not promoted. Review artifacts at
  reports/tranches/gse193716_iAEC2_subset_review_v1/.
