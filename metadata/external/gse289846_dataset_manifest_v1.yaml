why_this_dataset: >-
  First non-BU/non-Rawlins independent-lab candidate for the comparison world.
  Gotoh lab (CiRA, Kyoto University) iPSC-derived alveolar organoids on
  micro-patterned plates with 3 differentiation conditions (AT2 baseline,
  AT1 induction via LATS-IN-1, transitional state via PAL). Adds cross-lab
  replication and an AT1/AT2 transitional axis not present in existing tranches.
  Complements GSE221343 (Kotton/BU, CK+DCI/YAP5SA/L+DCI) with a different
  protocol and iPSC line.

added_value_vs_existing_world: >-
  Cross-lab replication (Kyoto vs Boston); AT1/AT2/transitional condition axis;
  different iPSC line (B2-3 vs SPC2-ST-B2); different differentiation protocol
  (micro-patterned plate + LATS inhibition vs Matrigel alveolosphere + LDCI).

low_friction_notes: >-
  3 condition-level CellRanger mtx triplets publicly available as series-level
  supplementary. 10x Chromium 3' v3.1, CellRanger 7.1.0, hg38. No mixed
  organ/species issues. Clear condition naming.

public_artifact_situation: >-
  Supplementary count matrices are condition-level (3 triplets), not
  per-GSM-replicate (6 triplets). Each condition merges 2 biological replicates.
  Per-GSM supplementary files are NONE. Replicate-level separation would
  require barcode suffix parsing or SRA FASTQ re-processing. Registration v1
  uses condition-level 3 rows as canonical registry units.

registration_notes: >-
  [Superseded by conversion_notes and review_notes above.]
  Dataset-level registration only. Raw supplementary files have NOT been
  downloaded. Sample sheet v1 has NOT been built beyond registration rows.
  query_ready_flag must remain false until local artifact inspection confirms
  h5ad structure, gene-space overlap, and raw-count availability. This is the
  third external organoid intake candidate after GSE237359 and GSE221343.
  Selected for independent-lab cross-validation value (Gotoh lab, CiRA Kyoto),
  3-condition alveolar differentiation axis, and low integration friction.

conversion_notes: >-
  Mtx-to-H5AD conversion completed 2026-04-06. All 3 conditions: CellRanger
  v7.1.0 condition-level mtx triplets, int64 raw counts, 36602 Gene Expression
  features, 30843/30852 (100.0%) reference gene overlap. Conversion script:
  queries/converted/gse289846/convert_gse289846_mtx_to_h5ad.py. qc_status set
  to local_validation_inspected_manual_review_required. query_ready_flag
  set to true after explicit reviewer promotion 2026-04-06.

review_notes: >-
  All 3 rows promoted to query_ready_flag=true after explicit reviewer
  decision 2026-04-06. Gate A (object contract), Gate B (provenance),
